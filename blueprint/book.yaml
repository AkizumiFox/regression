# The Ultimate Regression Textbook — single source of truth.
# sources: list of [DAG node, sections or "all"]. Node ids refer to blueprint/dag.json.
# cut: DAG nodes dropped as redundant, with the node that subsumes them (null = no replacement needed).
# exemptions: hard DAG edges that the ordering is allowed to cross, each with its justification.

title: "Regression: From Projection to Distribution"
subtitle: "A unified treatment of linear, generalized, mixed, additive and distributional regression"

cut:
  SA: R2
  CB: R2
  F1: null

exemptions:
  - edge: [R8, R12]
    why: "Rencher 12 is split. §12.1–12.6 (estimability, reparameterization, side conditions) needs only least squares; only §12.7–12.8 (testable hypotheses) uses Rencher 8, and it is placed in ch. 11 alongside it."
  - edge: [C4, C5]
    why: "Scheffé, Tukey and Bonferroni are simultaneous inference on estimable functions and need only the general linear hypothesis (Christensen 3). Christensen merely illustrates them with one-way ANOVA; Agresti §3.5 uses the same placement."
  - edge: [A4, A9]
    why: "Agresti 9 is split. §9.2–9.3 (linear mixed models) is Gaussian and needs no GLM machinery; §9.4–9.6 (GLMMs, GEE) goes to ch. 40, after Agresti 4."
  - edge: [F5, F7]
    why: "Fahrmeir 7 is split. §7.1–7.4 (linear mixed models) needs Fahrmeir 4 only; §7.5–7.6 (generalized linear mixed models) goes to ch. 40, after Fahrmeir 5."

parts:
  - num: I
    title: "Apparatus"
    drops: null
    model: "The mathematical tools: matrices, random vectors, the normal distribution, quadratic forms."
  - num: II
    title: "The Linear Model as a Projection"
    drops: null
    model: "y = Xβ + ε, E[ε] = 0, Cov(ε) = σ²I, rank(X) = p — and then without the rank condition for estimation."
  - num: III
    title: "Exact Inference under Normality"
    drops: "adds ε ~ N(0, σ²I)"
    model: "Finite-sample tests, intervals and prediction."
  - num: IV
    title: "Rank Deficiency and Designed Structure"
    drops: "drops rank(X) = p"
    model: "Estimability, analysis of variance, designed experiments."
  - num: V
    title: "When the Assumptions Fail"
    drops: "audits every assumption"
    model: "What breaks, how you see it, and what inference survives."
  - num: VI
    title: "Trading Bias for Variance"
    drops: "drops unbiasedness"
    model: "Shrinkage, selection, regularization, high dimensions."
  - num: VII
    title: "Relaxing the Covariance"
    drops: "drops Cov(ε) = σ²I"
    model: "Generalized least squares, general Gauss–Markov, mixed models."
  - num: VIII
    title: "Beyond the Normal Response"
    drops: "drops normality of y"
    model: "Exponential families and generalized linear models."
  - num: IX
    title: "Relaxing Linearity"
    drops: "drops the linear predictor"
    model: "Polynomials, splines, smoothing, additive structure."
  - num: X
    title: "Modeling the Whole Distribution"
    drops: "drops modeling only the mean"
    model: "Quantile regression and distributional (GAMLSS) models."

