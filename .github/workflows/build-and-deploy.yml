# Builds the book on every push to main, checks it, and publishes the site.
#
# Setup (once), for a private or public repository holding this source:
#   1. Create an SSH key pair:        ssh-keygen -t ed25519 -f deploy_key -N ""
#   2. In AkizumiFox/regression (the site repository): Settings > Deploy keys >
#      Add deploy key, paste deploy_key.pub, allow write access.
#   3. In this repository: Settings > Secrets and variables > Actions >
#      New repository secret DEPLOY_KEY, paste the private key (deploy_key).
# Pull requests are built and checked but not published.

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live, poppler, aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-pictures texlive-fonts-extra \
            lmodern \
            poppler-utils aspell aspell-en

      - name: Install Pandoc 3.1.3
        run: |
          curl -sSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-1-amd64.deb
          sudo dpkg -i pandoc.deb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache MathJax
        uses: actions/cache@v4
        with:
          path: ~/.cache/book-engine
          key: book-engine-mathjax-3.2.2

      - name: Check tools
        run: ./build.py doctor

      - name: Engine tests
        run: python -m unittest discover -s tests

      - name: Python dependencies for the book's code
        run: pip install -r code/requirements.txt

      - name: Run the book's scripts and check their numbers against the text
        run: MPLBACKEND=Agg python tools/check_numbers.py

      - name: Build website and PDFs
        run: ./build.py all

      - name: Check references, links, numbering
        run: ./build.py check

      - name: Publish to the site repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: AkizumiFox/regression
          # gh-pages, not main: since the sources moved onto main of this same
          # repository, publishing to main would overwrite the book with its own
          # rendered output on the first run.
          publish_branch: gh-pages
          publish_dir: ./_build/html
          cname: regression.akizumifox.com
          commit_message: Deploy
